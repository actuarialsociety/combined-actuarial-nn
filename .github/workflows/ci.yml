name: CI

# Unit tests, a smoke run of every pipeline (2% of data, few epochs), and every
# notebook executed in smoke mode. Downloads are cached between runs.

on:
  pull_request:
    paths: ["src/**", "conf/**", "tests/**", "notebooks/**", "pyproject.toml", ".github/workflows/ci.yml"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"
  MLFLOW_DISABLE_AGENT_HINT: "1"
  DAS_ENV: smoke

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - name: Install (CPU torch)
        run: |
          uv pip install --system --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install --system -e ".[dev]"
      - uses: actions/cache@v4
        with:
          path: data/01_raw
          key: raw-data-v1
      - run: pytest -q
      - run: kedro run --env smoke
      - name: Execute notebooks (smoke)
        run: |
          for nb in notebooks/*.ipynb; do
            jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=900 \
              --output-dir /tmp/nb "$nb"
          done
