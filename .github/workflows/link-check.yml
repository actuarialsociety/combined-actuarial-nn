name: Link check

on:
  pull_request:
    paths: ["**.md", "scripts/check_links.py", "scripts/fix_math.py", "scripts/link_citations.py"]
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/fix_math.py --github   # math renders on GitHub and the wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/link_citations.py --check
      - run: python3 scripts/check_links.py
