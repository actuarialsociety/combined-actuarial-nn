# Paid-loss reserving on the CAS Loss Reserving Database (accident years 1988-1997).
# Scale up from one line to all six: reserving.data.lines.
reserving:
  data:
    lines: [ppauto]       # any of: ppauto, wkcomp, comauto, medmal, prodliab, othliab
    max_companies: 50     # largest companies by premium per line; null = all that pass checks
    min_monotone: 0.95    # share of non-negative incrementals a company needs to be kept

  models:
    chain_ladder: {kind: chain_ladder}
    neural_odp:
      kind: neural_odp
      seed: 1
      embedding_dim: 2
      hidden: [16, 8]
      lr: 0.001
      epochs: 2000
