# `kedro run --env scale_up`: broader experiments beyond the reference setup.
# Benchmarks are skipped (they only apply to the reference setup in conf/base).
reference_setup: false

mortality:
  data:
    sexes: [Male, Female]     # each sex fitted separately

reserving:
  data:
    lines: [ppauto, wkcomp, comauto, medmal, prodliab, othliab]
    companies: null           # select by data checks instead of Meyers' list
    max_companies: null       # every company that passes the data checks (~260)
